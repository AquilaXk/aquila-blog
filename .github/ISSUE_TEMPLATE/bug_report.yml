name: "🐞 Bug / Fix"
description: "Report reproducible defects and gaps between expected and actual behavior."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Focus on evidence that can reproduce or verify the problem, and on completion criteria.
        Include implementation details and a full test list only when needed.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Choose based on user, data, and operational impact.
      options:
        - Sev1 - Service outage, data loss, or security incident
        - Sev2 - Core user-flow failure or release blocker
        - Sev3 - Workaround available for a feature or UI regression
        - Sev4 - Minor copy or visual issue
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: Name the affected module, screen, API, or operational area.
      placeholder: "Example: back/post, deploy/homeserver, .github/workflows/**"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: In one to three sentences, explain what is wrong and why it needs fixing.
      placeholder: "Example: The canonical summary on a public post detail page remains stale."
    validations:
      required: true

  - type: textarea
    id: reproduction_evidence
    attributes:
      label: Reproduction / Evidence
      description: Provide reproduction steps or evidence such as logs, screenshots, metrics, or related code.
      placeholder: |
        1. ...
        2. ...
        3. ...

        If reproduction is difficult:
        - Observed log or metric:
        - Time and environment:
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected / Actual
      description: Describe expected and actual behavior side by side.
      placeholder: |
        - Expected:
        - Actual:
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe affected users, functionality, data, operational scope, and whether a workaround exists.
      placeholder: |
        - Affected:
        - Frequency:
        - Workaround:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Separate work included in this fix from work explicitly excluded.
      placeholder: |
        In Scope
        - ...

        Out of Scope
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List three to seven observable completion criteria.
      placeholder: |
        - [ ] The defect does not reproduce under the same conditions
        - [ ] Related happy paths remain intact
        - [ ] Evidence comes from a focused regression test or representative check
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Related
      description: List the parent, related issues, external decisions, or blocking dependencies when applicable.
      placeholder: |
        - Parent / Related:
        - Blocking:
        - Repository owner:

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List the smallest verification proportional to the change risk and any required runtime environment.
      placeholder: |
        - Focused test:
        - Representative manual/runtime check:
        - Required CI:
        - Deferred verification and rerun condition: None
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Ready Check
      options:
        - label: "I searched [open issues](https://github.com/AquilaXk/aquila-blog/issues) for duplicates."
          required: true
        - label: "The evidence, scope, and completion criteria are clear enough to begin implementation."
          required: true
