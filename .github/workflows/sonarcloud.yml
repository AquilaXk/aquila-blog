name: SonarCloud

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "back/**"
      - "sonar-project.properties"
      - ".sonarcloud.properties"
      - ".github/workflows/sonarcloud.yml"
  push:
    branches:
      - main
    paths:
      - "back/**"
      - "sonar-project.properties"
      - ".sonarcloud.properties"
      - ".github/workflows/sonarcloud.yml"

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  automatic-analysis:
    if: vars.SONARCLOUD_CI_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep SonarCloud automatic analysis
        run: echo "SonarCloud CI scanner is skipped because SONARCLOUD_CI_ENABLED is not true."

  sonarcloud:
    if: vars.SONARCLOUD_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      TEST_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      TEST_REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Generate backend coverage
        working-directory: back
        run: ./gradlew test jacocoPrReport --rerun-tasks

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
