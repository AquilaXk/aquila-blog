name: "🧭 Epic / Tracker"
description: "Track goals, owners, sequencing, and completion status across child issues."
title: "[Epic] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        An Epic does not repeat child implementation or full verification.
        Each child owns its PR and evidence; the parent aggregates only status and links.

  - type: input
    id: domain
    attributes:
      label: Domain
      description: Name the product or platform area covered by this Epic.
      placeholder: "Example: canonical-summary, repository-boundary, task-platform"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the state that must be different when the Epic closes.
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      description: List the canonical repository and issue owner for each area.
      placeholder: |
        | Area | Repository / Canonical Issue |
        |---|---|
        | Producer | |
        | Consumer | |
        | Operations | |
    validations:
      required: true

  - type: textarea
    id: child_issues
    attributes:
      label: Child Issues
      description: Link child issues with their priority and status.
      placeholder: |
        P0
        - [ ] #

        P1
        - [ ] #

        Deferred
        - [ ] # — reason / resume condition
    validations:
      required: true

  - type: textarea
    id: dependency_order
    attributes:
      label: Dependency Order
      description: Briefly describe the real dependency order and work that can proceed in parallel.
      placeholder: |
        #A → #B
        #C and #D in parallel
        Serialize only large PRs that touch the same files
    validations:
      required: true

  - type: textarea
    id: exit_criteria
    attributes:
      label: Epic Exit Criteria
      description: List only parent completion criteria; do not duplicate child tests.
      placeholder: |
        - [ ] Required children are complete
        - [ ] Deferred children record their reason and resume condition
        - [ ] No duplicate owner exists
        - [ ] Each child's PR, CI, and operational evidence is linked
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence Aggregation
      description: List the PR, CI, and operational evidence to aggregate in the parent.
      placeholder: |
        - Child PR / CI links:
        - Runtime / rollout evidence:
        - Final ownership map:
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Ready Check
      options:
        - label: "I checked [open issues](https://github.com/AquilaXk/aquila-blog/issues) for duplicate Epics and implementation owners."
          required: true
        - label: "The parent does not duplicate ownership of child implementation or verification."
          required: true
