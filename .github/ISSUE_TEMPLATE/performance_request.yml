name: "⚡ Performance"
description: "Plan performance work for rendering, bundles, large queries, and bottlenecks."
labels: ["performance"]
body:
  - type: input
    id: target
    attributes:
      label: Target
      description: Name the page, API, or rendering path to improve.
      placeholder: "Example: /posts/[id], GET /post/api/v1/posts/search, front build bundle"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Explain the traffic, data scale, or user scenario where the problem appears.
      placeholder: "Example: Refreshing a public post detail triggers both hydration mismatch and a CLS spike."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Metric
      description: Provide the observed performance metrics or perceived problem.
      placeholder: "Example: p95 3.1s, JS 420KB, CLS 0.38"
    validations:
      required: true

  - type: textarea
    id: target_metric
    attributes:
      label: Target Metric
      description: State the target level after improvement.
      placeholder: "Example: p95 at most 1.2s, JS at most 300KB, CLS at most 0.1"
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: Bottleneck / Hypothesis
      description: Describe the suspected bottleneck or the first point to investigate.
      placeholder: "Example: DOM mutation after initial hydration, oversized search candidate pool, image layout shift"
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Plan
      description: Describe how to verify the improvement as a checklist.
      placeholder: |
        - [ ] Did we remeasure the same scenario?
        - [ ] Did we run both local and live-page verification?
        - [ ] Did we compare the before and after metrics?
    validations:
      required: true

  - type: textarea
    id: execution_contract
    attributes:
      label: Execution Contract
      description: Record the contract fixed by root so the worker does not infer implementation decisions.
      placeholder: |
        - Confirmed decisions / interfaces:
        - Allow:
        - Deny / Non-goals:
        - Completion criteria / edge cases:
        - Unresolved implementation decisions: None
    validations:
      required: true

  - type: textarea
    id: verification_delivery
    attributes:
      label: Verification & Delivery
      description: List verification to run, evidence to retain, skip conditions, and feature-sized commits.
      placeholder: |
        - Exact commands:
        - Expected / observed evidence:
        - Skipped checks and rerun conditions: None
        - Commit slices:
          1. perf(scope): work summary
    validations:
      required: true
