name: "🔧 Task"
description: "리팩터링, 문서, 테스트, 운영, 빌드처럼 유지보수와 정리가 필요한 작업을 정리합니다."
labels: ["task"]
body:
  - type: dropdown
    id: task_type
    attributes:
      label: Task Type
      options:
        - Refactor
        - Docs
        - Test
        - Build / CI
        - Ops
        - Security
        - Chore
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: 관련 모듈, 화면, 운영 영역을 적어 주세요.
      placeholder: 예) back/post, front/editor, admin/dashboard, github-actions
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Description
      description: 어떤 작업인지와 왜 지금 필요한지 설명해 주세요.
      placeholder: 예) 검색 쿼리 서비스 책임을 분리해 유지보수성과 테스트 범위를 정리합니다.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done When
      description: 완료로 볼 기준을 `...했는가?` 형태의 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 목표로 한 정리가 끝났는가?
        - [ ] 관련 검증과 문서 반영까지 마쳤는가?
    validations:
      required: true

  - type: textarea
    id: execution_contract
    attributes:
      label: Execution Contract
      description: Worker가 구현 결정을 추측하지 않도록 root에서 확정한 계약을 적어 주세요.
      placeholder: |
        - Confirmed decisions / interfaces:
        - Allow:
        - Deny / Non-goals:
        - Completion criteria / edge cases:
        - Unresolved implementation decisions: 없음
    validations:
      required: true

  - type: textarea
    id: verification_delivery
    attributes:
      label: Verification & Delivery
      description: 실행할 검증, 남길 증거, skip 조건, 기능 단위 commit을 적어 주세요.
      placeholder: |
        - Exact commands:
        - Expected / observed evidence:
        - Skipped checks and rerun conditions: 없음
        - Commit slices:
          1. chore(scope): 작업 요약
    validations:
      required: true
