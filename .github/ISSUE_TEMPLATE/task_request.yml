name: "🛠 Task / Feature / Refactor"
description: "Plan feature, refactor, test, documentation, and routine maintenance work."
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Clarify the problem and goal first, and record only implementation decisions that are already fixed.
        You do not need to prewrite every edge case, command, or commit plan.

  - type: dropdown
    id: work_type
    attributes:
      label: Work Type
      options:
        - Feature
        - Refactor
        - Chore
        - Docs
        - Test
        - Build / CI
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: Name the related module, screen, API, or file area.
      placeholder: "Example: back/post, tools/contracts, deploy/homeserver, docs/**"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: In one to three sentences, explain what will change and why.
      placeholder: "Example: Consolidate the summary selector so public surfaces show consistent results."
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem / Evidence
      description: Provide evidence for the current structural problem, user friction, operational cost, or need for change.
      placeholder: |
        - Current:
        - Problem:
        - Evidence:
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the outcome that must be different when this issue is complete.
      placeholder: |
        - Intended outcome:
        - Success metric: only when a quantitative metric is meaningful
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Separate work to include from work intentionally excluded.
      placeholder: |
        In Scope
        - ...

        Out of Scope
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List three to seven observable completion criteria, not implementation steps.
      placeholder: |
        - [ ] User or system outcomes behave as expected
        - [ ] Existing critical paths remain intact
        - [ ] Required documentation and contracts are updated in the same change
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Approach / Decisions
      description: Include only agreed direction, key constraints, trade-offs, or still-open questions.
      placeholder: |
        - Selected direction:
        - Constraints:
        - Alternatives considered:
        - Open questions:

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Related
      description: List the parent, related issues, external decisions, or repository owner.
      placeholder: |
        - Parent / Related:
        - Blocking:
        - Repository owner:

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List focused verification for the changed layer and only the representative checks required.
      placeholder: |
        - Focused unit/integration:
        - Representative E2E/manual check:
        - Required CI:
        - Before/after metric: only for performance work
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Ready Check
      options:
        - label: "I searched [open issues](https://github.com/AquilaXk/aquila-blog/issues) for duplicate work."
          required: true
        - label: "The scope, completion criteria, and owner are clear enough to begin implementation."
          required: true
