# SonarCloud Automatic Analysis 전용 설정.
#
# Automatic Analysis는 sonar-project.properties를 읽지 않고 이 파일만 참조한다.
# 그대로 두면 저장소 전체(deploy/, tools/ 포함)가 스캔되어 CI 스캐너 결과와
# 어긋나므로, 정식 스캔 범위(sonar-project.properties)를 여기에 동일하게 적용한다.
#
# 유지보수: 스캔 범위(sources/tests/exclusions)를 바꿀 때는 이 파일과
# sonar-project.properties를 반드시 함께 갱신해 두 값을 일치시킨다.

sonar.sourceEncoding=UTF-8

sonar.sources=back/src/main
sonar.tests=back/src/test

sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  back/src/main/resources/db/migration-test/**
