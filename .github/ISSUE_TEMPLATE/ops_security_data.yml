name: "🛡 Ops / Security / Data"
description: "Plan deployment, reliability, security, privacy, data, and performance-risk work."
title: "[Ops] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        For risky work, state the key invariants, failure boundaries, and recovery path instead of enumerating every case.
        Keep verification proportional to change risk, using dry-runs, canaries, and runtime evidence only when needed.
        Do not include vulnerability details, reproduction steps, PoCs, or secrets in public Issues; use the [GitHub Private vulnerability report](https://github.com/AquilaXk/aquila-blog/security/advisories/new).
        Public evidence must include only information with tokens, cookies, personal data, and internal URLs removed or redacted.

  - type: dropdown
    id: change_type
    attributes:
      label: Change Type
      options:
        - Ops / Reliability
        - Security / Privacy
        - Data / Migration
        - Performance / Capacity
        - Supply Chain
        - Cross-repository Contract
    validations:
      required: true

  - type: dropdown
    id: primary_risk
    attributes:
      label: Primary Risk
      options:
        - Runtime availability
        - Data integrity or migration
        - Security or privacy
        - Deployment or rollback
        - Cross-repository compatibility
        - Performance or capacity
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: Name the relevant runtime, database, workflow, API, or operational area.
      placeholder: "Example: back/global/task, DB migration, deploy/homeserver, .github/workflows/**"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: In one to three sentences, explain the change goal and the key outcome that must be protected.
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem / Evidence
      description: Describe the current risk, incident or performance evidence, inventory, or operational metrics.
      placeholder: |
        - Current state:
        - Evidence / incident / metric:
        - User or operational impact:
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the operational, data, or security outcome guaranteed at completion and any relevant target metric.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Separate this change from work deferred to follow-up.
      placeholder: |
        In Scope
        - ...

        Out of Scope / Follow-up
        - ...
    validations:
      required: true

  - type: textarea
    id: safety_contract
    attributes:
      label: Safety Contract
      description: List invariants to preserve, failure handling, sensitive data, and prohibited bypass paths.
      placeholder: |
        - Invariants:
        - Fail-closed / explicit failure:
        - Sensitive data:
        - Forbidden fallback or alternate path:
    validations:
      required: true

  - type: textarea
    id: rollout_rollback
    attributes:
      label: Rollout / Rollback / Recovery
      description: For deployment or data changes, list phases, checkpoints, and recovery; otherwise explain why it is unnecessary.
      placeholder: |
        - Rollout / dry-run / canary:
        - Checkpoint:
        - Rollback or recovery:
        - Not applicable reason:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List key success and failure boundaries as observable checklist items.
      placeholder: |
        - [ ] Key invariants are preserved
        - [ ] A representative failure is not reported as success
        - [ ] Operational or data evidence is retained
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Ownership
      description: List related issues, producer and consumer, approvers, and external blockers.
      placeholder: |
        - Parent / Related:
        - Producer / Consumer:
        - Blocking decision:
        - Repository owner:

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List key negative fixtures, focused tests, and required real-environment evidence.
      placeholder: |
        - Focused test / negative fixture:
        - Dry-run or canary:
        - Runtime / production evidence:
        - Required CI:
        - Deferred verification and rerun condition: None
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Ready Check
      options:
        - label: "I checked [open issues](https://github.com/AquilaXk/aquila-blog/issues) for duplicate owners and related work."
          required: true
        - label: "The failure boundaries, scope, recovery path, and completion criteria are clear."
          required: true
