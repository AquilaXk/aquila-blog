activities:
  - id: auth_session_and_cookies
    name: 인증 세션, refresh token, 보안 cookie
    dataCategories:
      - accessToken
      - refreshTokenHash
      - sessionKey
      - authCookie
      - apiKey cookie
      - accessToken cookie
      - refreshToken cookie
      - sessionKey cookie
      - auth.login.keepSignedIn
      - auth.login.ipSecurityOn
      - auth:me:anon-probe-suppress-until:v1
      - header.auth-shell.v1
      - createdIp
      - userAgent
      - ipSecurityFingerprint
      - rememberLoginPreference
      - loginAttemptIdentifierKey
      - loginAttemptIpKey
      - administratorEmail
      - administratorEmailChallengeHash
      - administratorEmailRequestRateLimitKey
    dataSubjects:
      - registeredMember
    purpose: 관리자 이메일 인증, 로그인 상태 유지, 세션 탈취 방지, IP 보안 정책 적용
    legalBasis: contractAndLegitimateSecurityInterest
    collectionSource: /member/api/v1/auth/admin-email/request, /member/api/v1/auth/admin-email/verify, auth filter, browser cookies
    requiredOrOptional: requiredForLogin; ipSecurityOptional
    systemOfRecord: Redis administrator email challenge; PostgreSQL member_session; outbound SMTP; HttpOnly browser cookies
    processors:
      - home_server_postgresql
      - home_server_redis
      - smtp_provider_unconfirmed
      - cloudflare_tunnel
    overseasTransfer: reviewRequired:cloudflare-tunnel-provider-facts
    retentionRule: administrator email challenge until configured expiry, default 5 minutes; revoked sessions custom.privacy.retention.revokedSessionDays default 30 days; apiKey/accessToken/refreshToken/sessionKey cookies sessionOrConfiguredMaxAge; auth.login.keepSignedIn/auth.login.ipSecurityOn untilPreferenceChangeOrBrowserStorageClear
    destructionMethod: consumeOrExpireAdministratorEmailChallenge; revokeSessionExpireCookiePurgeExpiredSessions; auth.login.* browserPreferenceDeletion
    accessRoles:
      - accountOwner
      - serviceAdmin
      - databaseOperator
    encryption: refreshTokenHashAtRest; HttpOnlySecureSameSiteCookies; transportTls
    userRightsHandler: logoutAllSessionsAndPrivacyRequestEmail
    codeOwner: back/auth-session
    policySectionId: privacy-collection-session
    enabledByEnv: custom.admin.email; custom.auth.adminEmail.*; spring.mail.*; custom.prod.cookieDomain; custom.prod.frontUrl
    reviewRequired:
      - Cookie inventory is published in cookies.ko-KR.v1.0.2 and must stay aligned with browserStorageRegistry.

  - id: user_content_posts
    name: 게시글과 공개 프로필 콘텐츠
    dataCategories:
      - postTitle
      - postMarkdownContent
      - postRenderedHtml
      - profileNickname
      - profileRole
      - profileBio
      - profileImageUrl
      - aboutRole
      - aboutBio
      - aboutDetails
      - profileServiceLinks
      - profileContactLinks
      - postHitDedupHash
      - admin.editor.localDraft.v1
      - admin.editor.customTags
      - admin.editor.customCategories
      - admin.contentStudio.listConditions.v1
      - editor.actual-preview.v1:*
      - posts:public-cursor-disabled:v1
      - posts:runtime-endpoints:v1
      - feed.restore.*
      - durableTaskEnvelopeMetadata
      - postAttachmentObjectKeys
    dataSubjects:
      - registeredMember
      - publicVisitorWhenViewing
    purpose: 블로그 콘텐츠 작성, 공개 열람, 프로필 표시
    legalBasis: contractAndUserPublishedContent
    collectionSource: admin editor and profile editor
    requiredOrOptional: optionalUserGeneratedContent
    systemOfRecord: PostgreSQL post, member profile columns, member_attr profile/home fields; transient durable task queue
    processors:
      - home_server_postgresql
      - home_server_redis
      - cloudflare_tunnel
    overseasTransfer: reviewRequired:cloudflare-tunnel-provider-facts
    retentionRule: untilUserDeletionOrContentDeletion; publicCacheUntilRevalidation; admin.editor.localDraft.v1 sevenDaysFromSavedAt; admin.editor.customTags/admin.editor.customCategories untilCatalogChange; admin.contentStudio.listConditions.v1 untilPreferenceChange; editor.actual-preview.v1:*/posts:public-cursor-disabled:v1/posts:runtime-endpoints:v1/feed.restore.* untilTabCloseOrBrowserStorageClear; durable task payload COMPLETED/QUARANTINED immediate redaction, FAILED max 7 days; terminal task row COMPLETED 7 days, FAILED/QUARANTINED 30 days
    destructionMethod: softDeleteThenCachePurge; anonymizeWhereRequired; admin.editor.localDraft.v1 manualClearPublishOrTtlExpiry; editor.actual-preview.v1:*/posts:public-cursor-disabled:v1/posts:runtime-endpoints:v1/feed.restore.* tabCloseOrBrowserStorageDeletion; bounded taskRetentionCleanup redaction and purge
    accessRoles:
      - contentAuthor
      - serviceAdmin
      - databaseOperator
      - publicVisitorForPublishedContent
    encryption: transportTls; databaseDiskEncryptionReviewRequired
    userRightsHandler: privacyRequestEmailAndContentDeletionFlow
    codeOwner: back/post
    policySectionId: privacy-collection-content
    enabledByEnv: alwaysEnabledForBlogCore
    reviewRequired:
      - User-entered sensitive data in content remains user responsibility but deletion handling must be operationalized.

  - id: file_uploads_profile_post_cloud
    name: 게시글·프로필·관리자 cloud 파일 업로드
    dataCategories:
      - objectKey
      - originalFilename
      - contentType
      - fileSize
      - mediaKind
      - checksumSha256
      - ownerMemberId
      - ownerObjectId
      - aquila-cloud-video-upload-session:*
    dataSubjects:
      - registeredMember
      - contentAuthor
    purpose: 이미지, 첨부 파일, 프로필 이미지, 관리자 파일 보관과 제공
    legalBasis: contractAndUserPublishedContent
    collectionSource: multipart upload endpoints and admin cloud workspace
    requiredOrOptional: optionalUserGeneratedContent
    systemOfRecord: PostgreSQL uploaded_file, cloud_file; MinIO object storage
    processors:
      - home_server_postgresql
      - home_server_minio
      - home_server_backup_storage
      - cloudflare_tunnel
    overseasTransfer: reviewRequired:cloudflare-tunnel-provider-facts
    retentionRule: activeUntilOwnerDeletion; tempUploadsUntilPurgeAfter; deletedObjectsUntilBackupExpiry; aquila-cloud-video-upload-session:* untilUploadCompleteCancelOrStale
    destructionMethod: objectDeleteAndMetadataMarkDeleted; backupExpiryOrTombstoneFutureWork; aquila-cloud-video-upload-session:* localStorageClearOnCompleteCancelOrStale
    accessRoles:
      - contentAuthor
      - serviceAdmin
      - storageOperator
      - publicVisitorForPublishedObjects
    encryption: transportTls; objectStorageDiskEncryptionReviewRequired
    userRightsHandler: privacyRequestEmailAndFutureAccountDeletionFlow
    codeOwner: back/storage-cloud
    policySectionId: privacy-collection-files
    enabledByEnv: custom.storage.*; AQUILA_EXTERNAL_STORAGE_ROOT
    reviewRequired:
      - Backup tombstone handling is tracked by issue1004.

  - id: auth_security_events
    name: 인증 보안 이벤트와 IP 보안 감사
    dataCategories:
      - eventType
      - memberId
      - loginIdentifier
      - rememberLoginEnabled
      - ipSecurityEnabled
      - clientIpFingerprint
      - loginAttemptIdentifierKey
      - loginAttemptIpKey
      - requestPath
      - reason
    dataSubjects:
      - registeredMember
      - loginApplicant
    purpose: 로그인 이상행위 감지, 세션 재사용 탐지, 보안 감사
    legalBasis: legitimateSecurityInterest
    collectionSource: login controller, auth filter, security event service
    requiredOrOptional: requiredForSecurity
    systemOfRecord: PostgreSQL auth_security_event; application logs
    processors:
      - home_server_postgresql
      - home_server_redis
      - grafana_loki_monitoring
    overseasTransfer: noPlannedOverseasTransferForDatabase; monitoringHostLocal
    retentionRule: custom.privacy.retention.authSecurityEventDays default 30 days
    destructionMethod: scheduledPurgeAndLogRetentionExpiry
    accessRoles:
      - serviceAdmin
      - securityOperator
      - databaseOperator
    encryption: clientIpFingerprintInsteadOfRawIp; transportTls
    userRightsHandler: privacyRequestEmailSubjectToSecurityAuditException
    codeOwner: back/security
    policySectionId: privacy-collection-security-log
    enabledByEnv: alwaysEnabledForAuthSecurity
    reviewRequired:
      - loginIdentifier stores null for member-known success events and one-way hash for anonymous blocked identifiers.

  - id: member_action_logs
    name: 관리자·사용자 action log
    dataCategories:
      - actionType
      - primaryTarget
      - secondaryTarget
      - actorMemberId
      - actionDataText
      - durableTaskEnvelopeMetadata
    dataSubjects:
      - registeredMember
      - affectedContentOwner
    purpose: 관리자 작업 추적, 콘텐츠 변경 감사, 오남용 조사
    legalBasis: legitimateSecurityAndOperationalInterest
    collectionSource: domain events and member action log listener
    requiredOrOptional: requiredForAdminAudit
    systemOfRecord: PostgreSQL member_action_log; transient durable task queue
    processors:
      - home_server_postgresql
      - grafana_loki_monitoring
    overseasTransfer: noPlannedOverseasTransferForDatabase
    retentionRule: custom.privacy.retention.memberActionLogDays default 90 days; durable task payload COMPLETED/QUARANTINED immediate redaction, FAILED max 7 days; terminal task row COMPLETED 7 days, FAILED/QUARANTINED 30 days
    destructionMethod: privacyRetentionCleanup scheduled batch purge; bounded taskRetentionCleanup redaction and purge
    accessRoles:
      - serviceAdmin
      - securityOperator
      - databaseOperator
    encryption: transportTls; rawDataMinimizationRequired
    userRightsHandler: privacyRequestEmailSubjectToAuditException
    codeOwner: back/member-action-log
    policySectionId: privacy-collection-action-log
    enabledByEnv: alwaysEnabledForAuditableActions
    reviewRequired:
      - action log data stores structured_audit_v1 metadata without post body text.

  - id: backup_and_restore
    name: PostgreSQL, MinIO, deploy rollback backup
    dataCategories:
      - databaseSnapshot
      - objectStorageArchive
      - backupMetadata
      - deploymentConfigSnapshot
      - operationalLogs
    dataSubjects:
      - registeredMember
      - contentAuthor
      - publicVisitorWhenLogsExist
    purpose: 장애 복구, 배포 rollback, 데이터 손실 방지, restore drill
    legalBasis: legitimateOperationalAndSecurityInterest
    collectionSource: deploy and backup scripts
    requiredOrOptional: requiredForOperations
    systemOfRecord: home server backup directory under external storage root
    processors:
      - home_server_backup_storage
      - github_actions
      - ghcr_container_registry
    overseasTransfer: possibleViaGitHubActionsLogsAndContainerRegistryMetadata
    retentionRule: backupClassRetentionPolicyInDeployScripts; privacyTombstoneFutureWork
    destructionMethod: pruneExternalBackupsAndDeployBackupRotation; encryptedDeletionFutureWork
    accessRoles:
      - infrastructureOperator
      - serviceAdmin
    encryption: backupEncryptionRequiredByIssue1004; transportTlsForImageRegistry
    userRightsHandler: restoreTombstoneReplayFutureWork
    codeOwner: deploy/home-server
    policySectionId: privacy-retention-backup
    enabledByEnv: AQUILA_BACKUP_ROOT; deploy workflow_run
    reviewRequired:
      - Backup encryption and restore tombstone replay are tracked by issue1004.
