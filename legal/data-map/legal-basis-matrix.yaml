legalReviewNotes:
  - reviewRequired가 있는 activity는 정책 문서에 확정 문구로 쓰지 않는다.
  - SMTP provider와 Cloudflare Tunnel의 region, transfer, contract, retention은 provider-account evidence 없이 확정하지 않는다.
  - 법적 리스크 0%는 기술적으로 보장할 수 없으며 출시 gate issue1009에서 전문가 검토 evidence로 관리한다.
