# Homeserver steady-state guard log rotation configuration
# Managed automatically within steady_state_guard.sh; this config is available
# for manual or system logrotate runs (e.g. logrotate -s .logrotate.status logrotate.conf).
/home/aquila/app/deploy/homeserver/.steady-state-guard.log {
    size 10M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
