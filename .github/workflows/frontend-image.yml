name: Frontend Image

# Epic #1535 Locked Decision 2: Web은 GHCR push까지만 소유하고, 홈서버 배포는 Platform이 한다 (#1539).
# front 이미지 빌드를 deploy.yml에 넣지 않는 이유이자, 이 워크플로가 따로 있는 이유다.

on:
  push:
    branches:
      - main
    paths:
      # front/Dockerfile.runtime의 builder stage는 `COPY . .`로 front/ 전체를 컨텍스트에 넣는다.
      # front/.dockerignore가 실제로 빼는 것은 node_modules·.next·.git·.github·env·리포트 산출물뿐이고
      # docs/·e2e/·tests/는 (e2e/는 prebuild guard 때문에 의도적으로) 컨텍스트에 남는다.
      # 과소 트리거는 main의 front 변경이 이미지에 반영되지 않은 채 stale digest가 배포되는 결함이므로
      # 실제 입력의 상위집합인 front/**를 트리거로 쓴다. 과잉 빌드는 gha 캐시가 흡수한다.
      - "front/**"
      - ".github/workflows/frontend-image.yml"
  workflow_dispatch:

# SHA별로 태그가 갈리므로 레지스트리 경합은 없지만, 취소된 빌드는 그 커밋의 digest를 영원히
# 남기지 않는다. 모든 main 커밋이 배포 가능한 digest를 갖도록 취소 대신 직렬화한다.
concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push front image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      front_image_ref: ${{ steps.front_image.outputs.front_image_ref }}
      front_image_name: ${{ steps.meta.outputs.image_name }}
      build_sha: ${{ steps.meta.outputs.build_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Calculate front image name and tag
        id: meta
        env:
          BUILD_SHA_INPUT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # backend(deploy.yml calculateTag)와 같은 규칙으로 계산한다. owner를 하드코딩하면
          # fork나 소유자 rename에서 존재하지 않는 패키지로 push를 시도한다.
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="$(basename "${GITHUB_REPOSITORY}")"
          BUILD_SHA="${BUILD_SHA_INPUT:-}"
          if [ -z "${BUILD_SHA}" ]; then
            echo "front build sha is empty" >&2
            exit 1
          fi

          IMAGE_NAME="ghcr.io/${OWNER_LC}/${REPO_NAME}-front"
          IMAGE_TAG="sha-${BUILD_SHA}"
          IMAGE_REF="${IMAGE_NAME}:${IMAGE_TAG}"

          {
            echo "image_name=${IMAGE_NAME}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_ref=${IMAGE_REF}"
            echo "build_sha=${BUILD_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "front image target: ${IMAGE_REF}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # front/Dockerfile은 front/Makefile이 쓰는 로컬 개발 컨테이너다. 운영 이미지는 Dockerfile.runtime뿐이다.
      # NEXT_PUBLIC_* build-arg 주입은 #1540이 확정한다. 이 워크플로는 값을 정하지 않는다.
      - name: Build and push front image
        id: build_front_image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ./front
          file: ./front/Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha,scope=front-image
          cache-to: type=gha,mode=max,scope=front-image

      - name: Export front digest image ref
        id: front_image
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          FRONT_IMAGE_DIGEST: ${{ steps.build_front_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          # digest가 비면 후속 소비자(#1539)는 태그 ref로 되돌아갈 수밖에 없다. 여기서 닫는다.
          if [ -z "${FRONT_IMAGE_DIGEST}" ]; then
            echo "front image digest is empty" >&2
            exit 1
          fi
          case "${FRONT_IMAGE_DIGEST}" in
            sha256:*) ;;
            *)
              echo "front image digest is not a sha256 reference: ${FRONT_IMAGE_DIGEST}" >&2
              exit 1
              ;;
          esac

          echo "front_image_ref=${IMAGE_NAME}@${FRONT_IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "front image ref: ${IMAGE_NAME}@${FRONT_IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull the pushed front image by digest
        env:
          FRONT_IMAGE_REF: ${{ steps.front_image.outputs.front_image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          # digest로 다시 받아야 스캔·크기 측정 대상이 레지스트리에 올라간 그 아티팩트와 같다.
          docker pull "${FRONT_IMAGE_REF}"

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Validate vulnerability exception allowlist
        run: node tools/guards/check-vulnerability-exceptions.mjs

      # security.yml의 container-image-scan은 front 쪽에서 base 태그만 확인한다. 그래서
      # Dockerfile.runtime의 runtime stage가 설치하는 apk 패키지는 어느 스캔에도 잡히지 않았다(#1537).
      # OS 패키지만 본다: 애플리케이션 의존성은 frontend-lockfile-audit(OSV/Trivy)이 담당한다.
      - name: Trivy scan pushed front image
        env:
          IMAGE: ${{ steps.front_image.outputs.front_image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/trivy-front-image.json"

          set +e
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --pkg-types os \
            --list-all-pkgs --format json --output "${report}" "${IMAGE}"
          trivy_status=$?
          set -e
          # trivy는 --exit-code 없이는 취약점 발견 시에도 0을 낸다. 0이 아니면 도구/DB 실패이므로
          # 게이트를 실패시킨다 (allowlist 판정은 check-vulnerability-exceptions.mjs 소관).
          if [ "${trivy_status}" -ne 0 ]; then
            echo "trivy image failed with status ${trivy_status}" >&2
            exit "${trivy_status}"
          fi
          test -s "${report}"

          # 구조적으로 유효하지만 패키지를 하나도 파싱하지 못한 리포트는 allowlist filter를 그냥 통과한다.
          # wget은 dockerfile-supply-chain.test.mjs가 runtime stage 계약으로 고정한 패키지다.
          # 그것이 결과에 없으면 스캔이 runtime stage의 apk DB를 읽지 못했다는 뜻이다.
          scan_summary="$(node -e '
            const fs = require("node:fs")
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            const packages = (report.Results || []).flatMap((result) => result.Packages || [])
            const marker = packages.some((pkg) => (pkg.Name || "") === "wget")
            process.stdout.write(packages.length + " " + (marker ? "present" : "absent"))
          ' "${report}")"
          scanned_packages="${scan_summary%% *}"
          runtime_marker="${scan_summary##* }"

          if ! [[ "${scanned_packages}" =~ ^[0-9]+$ ]] || [ "${scanned_packages}" -lt 1 ]; then
            echo "::error title=Front image scan produced no packages::trivy parsed '${scanned_packages}' packages from ${IMAGE}; refusing to pass (#1537)." >&2
            exit 1
          fi
          if [ "${runtime_marker}" != "present" ]; then
            echo "::error title=Front image scan missed the runtime stage::wget is a runtime stage contract but was absent from the scanned package list; refusing to pass (#1537)." >&2
            exit 1
          fi
          echo "trivy parsed ${scanned_packages} OS package(s) from ${IMAGE} (runtime stage marker: wget ${runtime_marker})"

          node tools/guards/check-vulnerability-exceptions.mjs --filter-trivy "${report}"

      # #1545가 400MB 상한 대비 여유를 확보하는 중이다. 상한 게이트는 그 이슈 소관이고 여기서는
      # 매 빌드마다 실측값을 남겨 재측정 지점을 만든다.
      - name: Report front image size
        env:
          FRONT_IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          FRONT_IMAGE_REF: ${{ steps.front_image.outputs.front_image_ref }}
        shell: bash
        run: |
          set -euo pipefail

          # #1545의 기준 지표와 같은 비압축 크기(`docker images` SIZE와 동일한 값).
          uncompressed_bytes="$(docker image inspect --format '{{.Size}}' "${FRONT_IMAGE_REF}")"
          if ! [[ "${uncompressed_bytes}" =~ ^[0-9]+$ ]] || [ "${uncompressed_bytes}" -lt 1 ]; then
            echo "front image size lookup returned no bytes: '${uncompressed_bytes}'" >&2
            exit 1
          fi

          # 레지스트리 전송량(압축 layer 합). attestation이 붙으면 최상위가 index라 자식 manifest를 한 번 더 본다.
          registry_bytes=""
          raw="$(docker buildx imagetools inspect --raw "${FRONT_IMAGE_REF}" 2>/dev/null || true)"
          if [ -n "${raw}" ]; then
            if printf '%s' "${raw}" | jq -e 'has("layers")' >/dev/null 2>&1; then
              registry_bytes="$(printf '%s' "${raw}" | jq -r '[.layers[].size] | add // empty')"
            else
              child="$(printf '%s' "${raw}" | jq -r '[.manifests[]? | select((.platform.os // "unknown") != "unknown") | .digest] | first // empty')"
              if [ -n "${child}" ]; then
                child_raw="$(docker buildx imagetools inspect --raw "${FRONT_IMAGE_NAME}@${child}" 2>/dev/null || true)"
                if [ -n "${child_raw}" ]; then
                  registry_bytes="$(printf '%s' "${child_raw}" | jq -r '[.layers[]?.size] | add // empty')"
                fi
              fi
            fi
          fi

          to_mb() { awk -v bytes="$1" 'BEGIN { printf "%.1f", bytes / 1000000 }'; }
          uncompressed_mb="$(to_mb "${uncompressed_bytes}")"
          if [[ "${registry_bytes}" =~ ^[0-9]+$ ]]; then
            registry_display="$(to_mb "${registry_bytes}") MB"
          else
            registry_display="unknown (manifest layer sizes unavailable)"
          fi

          echo "front image uncompressed size: ${uncompressed_mb} MB (${uncompressed_bytes} bytes)"
          {
            echo "## Front image"
            echo "- ref: \`${FRONT_IMAGE_REF}\`"
            echo "- uncompressed size: ${uncompressed_mb} MB (${uncompressed_bytes} bytes)"
            echo "- registry download size: ${registry_display}"
            echo "- size ceiling tracked by #1545: 400 MB (uncompressed)"
          } >> "$GITHUB_STEP_SUMMARY"
