name: Standalone Evidence Replay

on:
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/standalone-evidence-replay.yml"
      - "tools/test/standalone-evidence-replay-workflow.test.sh"

permissions:
  contents: read

concurrency:
  group: standalone-evidence-replay-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract_test:
    name: Standalone Evidence Replay Contract
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout replay workflow
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Verify replay workflow contract
        run: bash tools/test/standalone-evidence-replay-workflow.test.sh

  prepare:
    name: Validate standalone evidence command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1463 &&
      github.actor == github.repository_owner &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/standalone-evidence ')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout current main with history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact current-main source SHA
        id: source
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${COMMENT_BODY}" =~ ^/standalone-evidence[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            echo "command must be: /standalone-evidence <40-char-lowercase-sha>" >&2
            exit 1
          fi

          source_sha="${BASH_REMATCH[1]}"
          main_sha="$(git rev-parse origin/main^{commit})"
          if [[ "${source_sha}" != "${main_sha}" ]]; then
            echo "source SHA must equal current main: requested=${source_sha} current=${main_sha}" >&2
            exit 1
          fi

          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "${source_sha}" "${main_sha}"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

  web_standalone:
    name: Web Standalone
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact source SHA with history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - name: Verify standalone harness contracts
        run: |
          bash tools/test/repository-standalone-verification.test.sh
          bash tools/test/standalone-evidence-replay-workflow.test.sh

      - name: Run Web archive standalone gate
        env:
          STANDALONE_ARTIFACT_DIR: ${{ runner.temp }}/web-standalone
        run: bash tools/repo-split/verify-web-standalone.sh "${{ needs.prepare.outputs.source_sha }}"

      - name: Upload Web standalone evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-standalone-${{ needs.prepare.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-standalone
          if-no-files-found: error
          retention-days: 14

  platform_standalone:
    name: Platform Standalone
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact source SHA with history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify standalone harness contracts
        run: |
          bash tools/test/repository-standalone-verification.test.sh
          bash tools/test/standalone-evidence-replay-workflow.test.sh

      - name: Run Platform archive standalone gate
        env:
          STANDALONE_ARTIFACT_DIR: ${{ runner.temp }}/platform-standalone
          TEST_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'test_db_password_change_me' }}
          TEST_REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD || 'test_redis_password_change_me' }}
        run: bash tools/repo-split/verify-platform-standalone.sh "${{ needs.prepare.outputs.source_sha }}"

      - name: Upload Platform standalone evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: platform-standalone-${{ needs.prepare.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-standalone
          if-no-files-found: error
          retention-days: 14

  record_evidence:
    name: Record Standalone Evidence
    needs:
      - prepare
      - web_standalone
      - platform_standalone
    if: always() && needs.prepare.result == 'success'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record standalone evidence on issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          WEB_RESULT: ${{ needs.web_standalone.result }}
          PLATFORM_RESULT: ${{ needs.platform_standalone.result }}
          WEB_ARTIFACT: web-standalone-${{ needs.prepare.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          PLATFORM_ARTIFACT: platform-standalone-${{ needs.prepare.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA;
            const webResult = process.env.WEB_RESULT;
            const platformResult = process.env.PLATFORM_RESULT;
            const webArtifact = process.env.WEB_ARTIFACT;
            const platformArtifact = process.env.PLATFORM_ARTIFACT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = `<!-- standalone-evidence:${sourceSha}:${context.runId}:${context.runAttempt} -->`;
            const passed = webResult === 'success' && platformResult === 'success';
            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Standalone evidence replay`,
              '',
              `- Source main SHA: \`${sourceSha}\``,
              `- Run: ${runUrl}`,
              `- Run ID / attempt: \`${context.runId}\` / \`${context.runAttempt}\``,
              `- Web Standalone: **${webResult}**`,
              `- Platform Standalone: **${platformResult}**`,
              `- Web artifact: \`${webArtifact}\``,
              `- Platform artifact: \`${platformArtifact}\``,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

            if (!passed) {
              core.setFailed(`standalone replay failed: web=${webResult}, platform=${platformResult}`);
            }
