sonar.organization=aquilaxk
sonar.projectKey=AquilaXk_aquila-blog
sonar.projectName=aquila-blog
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# 스캔 범위(sources/tests/exclusions) 변경 시 .sonarcloud.properties도 함께 동기화할 것
# (Automatic Analysis는 이 파일이 아니라 .sonarcloud.properties만 읽는다).
sonar.sources=back/src/main
sonar.tests=back/src/test

sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  back/src/main/resources/db/migration-test/**

sonar.cpd.exclusions=\
  back/src/main/resources/db/migration-test/**

sonar.coverage.exclusions=\
  back/src/main/resources/**,\
  back/src/main/kotlin/com/back/BackApplication.kt

sonar.java.binaries=back/build/classes/java/main,back/build/classes/kotlin/main
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/pr/jacocoPrReport.xml
