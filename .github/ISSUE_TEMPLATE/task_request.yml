name: "🛠 Task / Feature / Refactor"
description: "기능, 리팩터링, 테스트, 문서와 일반 유지보수 작업을 정리합니다."
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        문제와 목표를 먼저 명확히 하고, 구현 방법은 확정된 결정만 기록해 주세요.
        모든 edge case·명령·commit 계획을 선행 작성할 필요는 없습니다.

  - type: dropdown
    id: work_type
    attributes:
      label: Work Type
      options:
        - Feature
        - Refactor
        - Chore
        - Docs
        - Test
        - Build / CI
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: 관련 모듈, 화면, API 또는 파일 영역을 적어 주세요.
      placeholder: "예) back/post, tools/contracts, deploy/homeserver, docs/**"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 무엇을 왜 하는지 1~3문장으로 설명해 주세요.
      placeholder: "예) summary selector를 한 곳으로 통합해 공개 표면의 결과를 일치시킵니다."
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem / Evidence
      description: 현재 구조의 문제, 사용자 불편, 운영 비용 또는 변경 필요성을 뒷받침하는 근거를 적어 주세요.
      placeholder: |
        - Current:
        - Problem:
        - Evidence:
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 이슈가 완료됐을 때 달라져 있어야 하는 결과를 적어 주세요.
      placeholder: |
        - Intended outcome:
        - Success metric: 정량 지표가 유효한 경우만
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 포함할 작업과 의도적으로 제외할 작업을 구분해 주세요.
      placeholder: |
        In Scope
        - ...

        Out of Scope
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 구현 방법이 아니라 관찰 가능한 완료 조건을 3~7개로 적어 주세요.
      placeholder: |
        - [ ] 사용자 또는 시스템 결과가 기대대로 동작함
        - [ ] 기존 핵심 경로가 유지됨
        - [ ] 필요한 문서·계약이 같은 변경에 반영됨
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Approach / Decisions
      description: 이미 합의된 방향, 주요 제약, 트레이드오프 또는 아직 열린 질문이 있을 때만 적어 주세요.
      placeholder: |
        - Selected direction:
        - Constraints:
        - Alternatives considered:
        - Open questions:

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Related
      description: Parent, 관련 이슈, 외부 결정 또는 저장소 owner를 적어 주세요.
      placeholder: |
        - Parent / Related:
        - Blocking:
        - Repository owner:

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: 변경한 계층의 focused 검증과 필요한 대표 확인만 적어 주세요.
      placeholder: |
        - Focused unit/integration:
        - Representative E2E/manual check:
        - Required CI:
        - Before/after metric: 성능 작업인 경우만
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Ready Check
      options:
        - label: "[열린 이슈](https://github.com/AquilaXk/aquila-blog/issues)에서 중복 작업을 검색했습니다."
          required: true
        - label: "범위, 완료 조건과 owner가 구현을 시작할 수 있을 만큼 명확합니다."
          required: true
