name: "🧭 Epic / Tracker"
description: "여러 child issue의 목표, owner, 순서와 종료 상태만 관리합니다."
title: "[Epic] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Epic은 child의 구현·전체 검증을 다시 수행하지 않습니다.
        각 child가 자기 PR과 evidence를 소유하고, Parent는 상태와 링크만 집계합니다.

  - type: input
    id: domain
    attributes:
      label: Domain
      description: Epic이 다루는 제품·플랫폼 영역을 적어 주세요.
      placeholder: "예) canonical-summary, repository-boundary, task-platform"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Epic 종료 시 달라져 있어야 하는 상태를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      description: 영역별 canonical repository와 issue owner를 적어 주세요.
      placeholder: |
        | Area | Repository / Canonical Issue |
        |---|---|
        | Producer | |
        | Consumer | |
        | Operations | |
    validations:
      required: true

  - type: textarea
    id: child_issues
    attributes:
      label: Child Issues
      description: 우선순위와 상태를 포함해 child issue를 연결해 주세요.
      placeholder: |
        P0
        - [ ] #

        P1
        - [ ] #

        Deferred
        - [ ] # — reason / resume condition
    validations:
      required: true

  - type: textarea
    id: dependency_order
    attributes:
      label: Dependency Order
      description: 실제 선행 관계와 병행 가능한 작업을 간단히 적어 주세요.
      placeholder: |
        #A → #B
        #C와 #D 병행
        같은 파일의 대형 PR만 직렬화
    validations:
      required: true

  - type: textarea
    id: exit_criteria
    attributes:
      label: Epic Exit Criteria
      description: Parent 자체의 종료 조건만 적고 child 테스트를 중복하지 마세요.
      placeholder: |
        - [ ] 필수 child가 completed
        - [ ] deferred child의 이유와 재개 조건이 기록됨
        - [ ] 중복 owner가 없음
        - [ ] 각 child의 PR·CI·운영 evidence가 연결됨
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence Aggregation
      description: Parent에 집계할 PR, CI, 운영 evidence 위치를 적어 주세요.
      placeholder: |
        - Child PR / CI links:
        - Runtime / rollout evidence:
        - Final ownership map:
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Ready Check
      options:
        - label: "[열린 이슈](https://github.com/AquilaXk/aquila-blog/issues)에서 중복 Epic과 구현 owner를 확인했습니다."
          required: true
        - label: "Parent가 child 구현·검증을 중복 소유하지 않습니다."
          required: true
