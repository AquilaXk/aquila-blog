name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "back/**"
      - "front/**"
      - "contracts/public-api/**"
      - "tools/contracts/**"
      - "tools/test/public-contract-manifest.test.mjs"
      - "tools/test/sync-public-contract-workflow.test.mjs"
      - "tools/test/setup-node-pin-parity.test.mjs"
      - "deploy/**"
      - "restore-privacy-gate.sh"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "CURSOR.md"
      - "COPILOT.md"
      - "docs/**"
      - "tools/guards/check-forbidden-tracked-files.sh"
      - "tools/guards/check-terraform-no-world-open-sg.sh"
      - "tools/ci/**"
      - "tools/repo-boundary/**"
      - "tools/repo-split/**"
      - "tools/guards/check-public-api-caddy-drift.sh"
      - "tools/guards/public-api-read-caddy-paths.sot"
      - "infra/**"
      - "tools/test/check-forbidden-tracked-files.test.sh"
      - "tools/test/materialize-compose-test-env.test.mjs"
      - "tools/test/repository-standalone-verification.test.sh"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "back/**"
      - "front/**"
      - "contracts/public-api/**"
      - "tools/contracts/**"
      - "tools/test/public-contract-manifest.test.mjs"
      - "tools/test/sync-public-contract-workflow.test.mjs"
      - "tools/test/setup-node-pin-parity.test.mjs"
      - "deploy/**"
      - "restore-privacy-gate.sh"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "CURSOR.md"
      - "COPILOT.md"
      - "docs/**"
      - "tools/guards/check-forbidden-tracked-files.sh"
      - "tools/guards/check-terraform-no-world-open-sg.sh"
      - "tools/ci/**"
      - "tools/repo-boundary/**"
      - "tools/repo-split/**"
      - "tools/guards/check-public-api-caddy-drift.sh"
      - "tools/guards/public-api-read-caddy-paths.sot"
      - "infra/**"
      - "tools/test/check-forbidden-tracked-files.test.sh"
      - "tools/test/materialize-compose-test-env.test.mjs"
      - "tools/test/repository-standalone-verification.test.sh"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-ci:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/reusable-backend-quality.yml
    secrets:
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'test_db_password_change_me' }}
      CI_REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD || 'test_redis_password_change_me' }}

  frontend-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-frontend-verify.yml

  web-standalone:
    name: Web Standalone
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact source SHA with history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - name: Verify standalone harness contracts
        run: bash tools/test/repository-standalone-verification.test.sh

      - name: Run Web archive standalone gate
        env:
          STANDALONE_ARTIFACT_DIR: ${{ runner.temp }}/web-standalone
        run: bash tools/repo-split/verify-web-standalone.sh "${GITHUB_SHA}"

      - name: Upload Web standalone evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-standalone-${{ github.sha }}
          path: ${{ runner.temp }}/web-standalone
          if-no-files-found: error
          retention-days: 14

  platform-standalone:
    name: Platform Standalone
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact source SHA with history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify standalone harness contracts
        run: bash tools/test/repository-standalone-verification.test.sh

      - name: Verify public contract sync workflow contract
        run: node --test tools/test/sync-public-contract-workflow.test.mjs

      - name: Verify setup-node pin parity contract
        run: node --test tools/test/setup-node-pin-parity.test.mjs

      - name: Run Platform archive standalone gate
        env:
          STANDALONE_ARTIFACT_DIR: ${{ runner.temp }}/platform-standalone
          TEST_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'test_db_password_change_me' }}
          TEST_REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD || 'test_redis_password_change_me' }}
        run: bash tools/repo-split/verify-platform-standalone.sh "${GITHUB_SHA}"

      - name: Upload Platform standalone evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-standalone-${{ github.sha }}
          path: ${{ runner.temp }}/platform-standalone
          if-no-files-found: error
          retention-days: 14
