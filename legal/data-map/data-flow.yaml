flows:
  - id: email_signup
    collectionPoint: /signup and /member/api/v1/signup/email/start
    stores:
      - PostgreSQL member
      - PostgreSQL member_signup_verification
    processors:
      - home_server_postgresql
      - home_server_redis
      - smtp_provider_unconfirmed
      - cloudflare_tunnel
    status: provider/region/DPA 확정 필요
  - id: kakao_oauth_login
    collectionPoint: Kakao redirect and Spring Security OAuth2
    stores:
      - PostgreSQL member
      - PostgreSQL pending_oauth_signup for new applicants
      - PostgreSQL member_legal_acceptance after consent
      - OAuth state cookie
    processors:
      - home_server_postgresql
      - kakao_oauth
      - cloudflare_tunnel
    status: 신규 가입은 /signup/social/complete pending 동의 완료 후 계정 생성
  - id: auth_session
    collectionPoint: login form and auth filter
    stores:
      - PostgreSQL member_session
      - HttpOnly browser cookies
    processors:
      - home_server_postgresql
      - home_server_redis
      - cloudflare_tunnel
    status: cookie inventory는 policy versioning 작업에서 확정
  - id: posts_comments_profile
    collectionPoint: admin editor, comment form, profile editor
    stores:
      - PostgreSQL post
      - PostgreSQL post_comment
      - PostgreSQL member profile columns
      - public frontend cache
    processors:
      - home_server_postgresql
      - home_server_redis
      - cloudflare_tunnel
    status: deletion/export는 issue999
  - id: uploads
    collectionPoint: post/profile/cloud multipart upload
    stores:
      - PostgreSQL uploaded_file
      - PostgreSQL cloud_file
      - MinIO object storage
    processors:
      - home_server_postgresql
      - home_server_minio
      - home_server_backup_storage
      - cloudflare_tunnel
    status: restore tombstone은 issue1004
  - id: security_and_action_logs
    collectionPoint: auth filter and domain events
    stores:
      - PostgreSQL auth_security_event
      - PostgreSQL member_action_log
      - Loki logs
    processors:
      - home_server_postgresql
      - home_server_redis
      - grafana_loki_monitoring
    status: auth security identifiers and member action log bodies are minimized by issue1001
  - id: notifications_sse
    collectionPoint: post/comment domain events and SSE API
    stores:
      - PostgreSQL member_notification
      - runtime SSE memory
    processors:
      - home_server_postgresql
      - home_server_redis
      - cloudflare_tunnel
    status: PostgreSQL member_notification is purged after custom.privacy.retention.notificationDays, default 60 days
  - id: backup_restore
    collectionPoint: deploy and backup scripts
    stores:
      - home server backup root
      - GitHub Actions workflow logs
      - GHCR package metadata
    processors:
      - home_server_backup_storage
      - github_actions
      - ghcr_container_registry
    status: encryption/tombstone은 issue1004

reviewBlockers:
  - SMTP provider name, region, TLS mode, DPA, retention policy
  - Backup encryption and deletion tombstone replay

codeEvidence:
  account: back/src/main/kotlin/com/back/boundedContexts/member/model/shared/Member.kt
  signupVerification: back/src/main/kotlin/com/back/boundedContexts/member/subContexts/signupVerification/model/MemberSignupVerification.kt
  session: back/src/main/kotlin/com/back/boundedContexts/member/subContexts/session/model/MemberSession.kt
  securityEvent: back/src/main/kotlin/com/back/global/security/model/AuthSecurityEvent.kt
  actionLog: back/src/main/kotlin/com/back/boundedContexts/member/subContexts/memberActionLog/model/MemberActionLog.kt
  post: back/src/main/kotlin/com/back/boundedContexts/post/model/Post.kt
  comment: back/src/main/kotlin/com/back/boundedContexts/post/model/PostComment.kt
  uploadedFile: back/src/main/kotlin/com/back/global/storage/model/UploadedFile.kt
  cloudFile: back/src/main/kotlin/com/back/boundedContexts/cloud/model/CloudFile.kt
  backup: deploy/homeserver/create_external_backup.sh
  restoreDrill: deploy/homeserver/restore_external_backup_drill.sh
