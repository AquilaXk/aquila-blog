retentionRules:
  - activityId: auth_session_and_cookies
    retention: administrator email challenge until configured expiry, default 5 minutes; revoked sessions custom.privacy.retention.revokedSessionDays default 30 days; apiKey/accessToken/refreshToken/sessionKey cookies sessionOrConfiguredMaxAge; auth.login.keepSignedIn/auth.login.ipSecurityOn untilPreferenceChangeOrBrowserStorageClear
    destruction: consumeOrExpireAdministratorEmailChallenge; revokeSessionExpireCookiePurgeExpiredSessions; auth.login.* browserPreferenceDeletion
    followUp: issue995
  - activityId: user_content_posts
    retention: untilUserDeletionOrContentDeletion; publicCacheUntilRevalidation; admin.editor.localDraft.v1 sevenDaysFromSavedAt; admin.editor.customTags/admin.editor.customCategories untilCatalogChange; admin.contentStudio.listConditions.v1 untilPreferenceChange; editor.actual-preview.v1:*/posts:public-cursor-disabled:v1/posts:runtime-endpoints:v1/feed.restore.* untilTabCloseOrBrowserStorageClear; durable task payload COMPLETED/QUARANTINED immediate redaction, FAILED max 7 days; terminal task row COMPLETED 7 days, FAILED/QUARANTINED 30 days
    destruction: softDeleteThenCachePurge; anonymizeWhereRequired; admin.editor.localDraft.v1 manualClearPublishOrTtlExpiry; editor.actual-preview.v1:*/posts:public-cursor-disabled:v1/posts:runtime-endpoints:v1/feed.restore.* tabCloseOrBrowserStorageDeletion; bounded taskRetentionCleanup redaction and purge
    followUp: issue999
  - activityId: file_uploads_profile_post_cloud
    retention: activeUntilOwnerDeletion; tempUploadsUntilPurgeAfter; deletedObjectsUntilBackupExpiry; aquila-cloud-video-upload-session:* untilUploadCompleteCancelOrStale
    destruction: objectDeleteAndMetadataMarkDeleted; backupExpiryOrTombstoneFutureWork; aquila-cloud-video-upload-session:* localStorageClearOnCompleteCancelOrStale
    followUp: issue1004
  - activityId: auth_security_events
    retention: custom.privacy.retention.authSecurityEventDays default 30 days
    destruction: scheduledPurgeAndLogRetentionExpiry
    followUp: issue1000, issue1001
  - activityId: member_action_logs
    retention: custom.privacy.retention.memberActionLogDays default 90 days; durable task payload COMPLETED/QUARANTINED immediate redaction, FAILED max 7 days; terminal task row COMPLETED 7 days, FAILED/QUARANTINED 30 days
    destruction: privacyRetentionCleanup scheduled batch purge; bounded taskRetentionCleanup redaction and purge
    followUp: issue1000, issue1001
  - activityId: backup_and_restore
    retention: backupClassRetentionPolicyInDeployScripts; privacyTombstoneFutureWork
    destruction: pruneExternalBackupsAndDeployBackupRotation; encryptedDeletionFutureWork
    followUp: issue1004

principles:
  - Security or legal hold data must be separated from account-visible data during deletion handling.
  - Backup retention can outlive database deletion, so restore must replay deletion tombstones before traffic opens.
  - Public browser tracking must not be reintroduced as an analytics or error-reporting fallback.
